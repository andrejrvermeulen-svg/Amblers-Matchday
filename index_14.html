<body>
<style id="css">
:root{
  --bg:#EEEBF2; --surface:#FFFFFF; --surface2:#F5F2F8; --line:#DAD3E2;
  --ink:#17121C; --ink2:#4E4557; --muted:#7C7387;
  --accent:#54246C; --accent-ink:#FFFFFF; --accent-soft:#EBE0F3;
  --club:#54246C; --club2:#7B4CA0; --club-ink:#120C17;
  --ok:#17703C; --ok-bg:#D9EFE0;
  --warn:#856008; --warn-bg:#F7E9C7;
  --high:#A04608; --high-bg:#F9E0CE;
  --crit:#B3261E; --crit-bg:#F8DAD7;
  --neu:#1F6F7A; --neu-bg:#D8ECEF;
  --shadow:0 1px 2px rgba(23,18,28,.07),0 4px 14px rgba(23,18,28,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#100C14; --surface:#1A141F; --surface2:#221A29; --line:#33293C;
    --ink:#EDE7F2; --ink2:#B6ACC0; --muted:#8E8399;
    --accent:#BC93DE; --accent-ink:#16101B; --accent-soft:#2A1E35;
    --club:#BC93DE; --club2:#8B5FBF; --club-ink:#EDE7F2;
    --ok:#6FD292; --ok-bg:#113020;
    --warn:#E6C169; --warn-bg:#352B0F;
    --high:#F0A06C; --high-bg:#3A2212;
    --crit:#F58A80; --crit-bg:#3C1A18;
    --neu:#74C6D2; --neu-bg:#102C31;
    --shadow:0 1px 2px rgba(0,0,0,.45),0 4px 14px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
    --bg:#100C14; --surface:#1A141F; --surface2:#221A29; --line:#33293C;
  --ink:#EDE7F2; --ink2:#B6ACC0; --muted:#8E8399;
  --accent:#BC93DE; --accent-ink:#16101B; --accent-soft:#2A1E35;
  --club:#BC93DE; --club2:#8B5FBF; --club-ink:#EDE7F2;
  --ok:#6FD292; --ok-bg:#113020;
  --warn:#E6C169; --warn-bg:#352B0F;
  --high:#F0A06C; --high-bg:#3A2212;
  --crit:#F58A80; --crit-bg:#3C1A18;
  --neu:#74C6D2; --neu-bg:#102C31;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 4px 14px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Barlow",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.45;
  -webkit-text-size-adjust:100%;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
}
#root{max-width:620px;margin:0 auto}
.num{font-family:"Roboto Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.lab{font-family:"Barlow Condensed","Helvetica Neue Condensed","Arial Narrow",Arial,sans-serif;text-transform:uppercase;letter-spacing:.08em;font-weight:600}

/* header */
header{
  position:sticky;top:0;z-index:20;background:var(--surface);
  border-bottom:1px solid var(--line);
  box-shadow:inset 0 3px 0 var(--club);
  padding:calc(11px + env(safe-area-inset-top)) 14px 10px;
  display:flex;align-items:center;gap:11px;
}
header .crest{flex:0 0 auto;width:40px;height:40px;border-radius:9px;background:#fff;
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:3px}
header .crest img{width:100%;height:100%;object-fit:contain;display:block}
header .name{display:flex;flex-direction:column;line-height:1;min-width:0;flex:1 1 auto;overflow:hidden}
header h1{margin:0;font-family:"Barlow Condensed","Helvetica Neue Condensed","Arial Narrow",Arial,sans-serif;font-weight:700;
  text-transform:uppercase;letter-spacing:.09em;font-size:18px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .sub{font-size:10.5px;color:var(--club2);letter-spacing:.13em;text-transform:uppercase;
  font-family:"Barlow Condensed","Helvetica Neue Condensed","Arial Narrow",Arial,sans-serif;font-weight:600;margin-top:3px}
#status{margin-left:auto;flex:0 0 auto;white-space:nowrap;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  font-family:"Barlow Condensed","Helvetica Neue Condensed","Arial Narrow",Arial,sans-serif;font-weight:600;color:var(--muted);
  display:flex;align-items:center;gap:5px}
#status i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:block}
#status[data-s="saved"] i{background:var(--ok)}
#status[data-s="unsaved"] i{background:var(--crit)}

main{padding:14px 12px 24px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 2px 8px}
.hd:first-child{margin-top:4px}
.hd h2{margin:0;font-family:"Barlow Condensed","Helvetica Neue Condensed","Arial Narrow",Arial,sans-serif;text-transform:uppercase;
  letter-spacing:.1em;font-size:13px;font-weight:700;color:var(--ink2)}
.hd .note{font-size:11px;color:var(--muted)}

/* chips */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink2);
  border-radius:999px;padding:7px 14px;font-family:"Barlow Condensed","Helvetica Neue Condensed","Arial Narrow",Arial,sans-serif;font-weight:600;
  text-transform:uppercase;letter-spacing:.07em;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* summary tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 8px;text-align:center}
.tile b{display:block;font-family:"Roboto Mono",monospace;font-size:20px;font-weight:700;line-height:1.1}
.tile span{display:block;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  font-family:"Barlow Condensed","Helvetica Neue Condensed","Arial Narrow",Arial,sans-serif;font-weight:600;margin-top:3px}
.tile.z0{background:var(--ok-bg);border-color:transparent} .tile.z0 b{color:var(--ok)}
.tile.z1{background:var(--warn-bg);border-color:transparent} .tile.z1 b{color:var(--warn)}
.tile.z2{background:var(--high-bg);border-color:transparent} .tile.z2 b{color:var(--high)}
.tile.z3{background:var(--crit-bg);border-color:transparent} .tile.z3 b{color:var(--crit)}

/* list */
.list{display:flex;flex-direction:column;gap:5px}
.row{display:flex;align-items:stretch;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-radius:10px;padding:0;overflow:hidden;cursor:pointer;
  font:inherit;color:inherit;box-shadow:var(--shadow)}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stripe{flex:0 0 5px;background:var(--line)}
.stripe.z0{background:var(--ok)} .stripe.z1{background:var(--warn)}
.stripe.z2{background:var(--high)} .stripe.z3{background:var(--crit)}
.stripe.zn{background:var(--neu)}
.rowin{flex:1;display:flex;align-items:center;gap:10px;padding:11px 12px;min-height:52px}
.who{flex:1;min-width:0}
.nm{display:block;font-weight:600;font-size:16px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub2{display:block;font-size:11px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;
  font-family:"Barlow Condensed","Helvetica Neue Condensed","Arial Narrow",Arial,sans-serif;font-weight:600;margin-top:1px}
.val{font-family:"Roboto Mono",monospace;font-size:17px;font-weight:700;flex:0 0 auto}
.val.z0{color:var(--ok)} .val.z1{color:var(--warn)} .val.z2{color:var(--high)}
.val.z3{color:var(--crit)} .val.zn{color:var(--neu)} .val.empty{color:var(--muted);font-weight:400}
.pill{font-family:"Barlow Condensed","Helvetica Neue Condensed","Arial Narrow",Arial,sans-serif;font-weight:600;text-transform:uppercase;
  letter-spacing:.06em;font-size:10.5px;padding:3px 7px;border-radius:5px;background:var(--surface2);color:var(--muted)}
.pill.z0{background:var(--ok-bg);color:var(--ok)} .pill.z1{background:var(--warn-bg);color:var(--warn)}
.pill.z2{background:var(--high-bg);color:var(--high)} .pill.z3{background:var(--crit-bg);color:var(--crit)}
.pill.zn{background:var(--neu-bg);color:var(--neu)}

/* test squares */
.sq{display:flex;gap:3px;flex:0 0 auto}
.sq b{width:15px;height:19px;border-radius:3px;background:var(--surface2);border:1px solid var(--line);
  font-family:"Barlow Condensed","Helvetica Neue Condensed","Arial Narrow",Arial,sans-serif;font-size:9px;font-weight:700;color:var(--muted);
  display:flex;align-items:center;justify-content:center}
.sq b.z0{background:var(--ok);border-color:var(--ok);color:#fff}
.sq b.z1{background:var(--warn);border-color:var(--warn);color:#fff}
.sq b.z2{background:var(--high);border-color:var(--high);color:#fff}
.sq b.z3{background:var(--crit);border-color:var(--crit);color:#fff}
:root[data-theme="dark"] .sq b.z0,:root[data-theme="dark"] .sq b.z1,
:root[data-theme="dark"] .sq b.z2,:root[data-theme="dark"] .sq b.z3{color:#151020}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sq b.z0,
 :root:not([data-theme="light"]) .sq b.z1,:root:not([data-theme="light"]) .sq b.z2,
 :root:not([data-theme="light"]) .sq b.z3{color:#151020}}

/* editor */
.editor{background:var(--surface);border:1px solid var(--accent);border-radius:10px;
  padding:14px 13px 13px;margin-top:-2px;box-shadow:var(--shadow)}
.editor h3{margin:0 0 2px;font-family:"Barlow Condensed","Helvetica Neue Condensed","Arial Narrow",Arial,sans-serif;text-transform:uppercase;
  letter-spacing:.09em;font-size:15px;font-weight:700}
.editor .hint{font-size:12px;color:var(--muted);margin:0 0 12px}
.fields{display:flex;flex-wrap:wrap;gap:9px}
.f{flex:1 1 88px;min-width:78px}
.f label{display:block;font-family:"Barlow Condensed","Helvetica Neue Condensed","Arial Narrow",Arial,sans-serif;text-transform:uppercase;
  letter-spacing:.07em;font-size:10.5px;font-weight:600;color:var(--muted);margin-bottom:3px}
.f input,.f select{width:100%;padding:11px 10px;border:1px solid var(--line);border-radius:8px;

  font-size:17px;font-weight:600;text-align:center;-webkit-appearance:none}
.f select{font-family:"Barlow",-apple-system,"Helvetica Neue",Arial,sans-serif;font-size:15px}
.f input:focus,.f select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.acts{display:flex;gap:8px;margin-top:13px}
.btn{flex:1;padding:12px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);

.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{flex:0 0 auto;padding:12px 16px}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.derived{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.derived span{font-size:11.5px;color:var(--ink2);background:var(--surface2);
  border-radius:6px;padding:5px 8px;font-family:"Barlow Condensed","Helvetica Neue Condensed","Arial Narrow",Arial,sans-serif;
  text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.derived span em{font-style:normal;font-family:"Roboto Mono",monospace;color:var(--ink);margin-left:4px}

/* profile */
.metric{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);
  border-radius:9px;padding:10px 12px}
.metric .mn{flex:1;font-family:"Barlow Condensed","Helvetica Neue Condensed","Arial Narrow",Arial,sans-serif;text-transform:uppercase;
  letter-spacing:.06em;font-weight:600;font-size:13px;color:var(--ink2)}
.metric .mv{font-family:"Roboto Mono",monospace;font-weight:700;font-size:16px;min-width:62px;text-align:right}
.metric .mr{flex:0 0 auto}
.rank{font-family:"Roboto Mono",monospace;font-size:11px;color:var(--muted);min-width:34px;text-align:right}

/* setup */
.srow{display:flex;flex-direction:column;gap:7px;background:var(--surface);
  border:1px solid var(--line);border-radius:10px;padding:10px 11px}
.srow .nm2{font-weight:600;font-size:15.5px;line-height:1.2}
.srow .ctl{display:grid;grid-template-columns:1fr 92px auto;gap:8px;align-items:center}

  background:var(--surface2);color:var(--ink);font-family:"Barlow",-apple-system,"Helvetica Neue",Arial,sans-serif;font-size:14.5px;-webkit-appearance:none}
.srow .ctl input{width:100%;min-width:0;padding:9px 6px;border:1px solid var(--line);border-radius:7px;

  font-size:15px;text-align:center;-webkit-appearance:none}
.srow .ctl .u{font-family:"Barlow Condensed","Helvetica Neue Condensed","Arial Narrow",Arial,sans-serif;text-transform:uppercase;
  letter-spacing:.06em;font-size:11px;font-weight:600;color:var(--muted)}
.srow.add{flex-direction:row;align-items:center}
.srow.add input{flex:1 1 auto;min-width:0;padding:10px;border:1px solid var(--line);border-radius:7px;
  background:var(--surface2);color:var(--ink);font-family:"Barlow",-apple-system,"Helvetica Neue",Arial,sans-serif;font-size:15px;-webkit-appearance:none}
.srow select:focus,.srow input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:14px}
.card p{margin:0 0 9px;font-size:13.5px;color:var(--ink2)}
.card p:last-child{margin-bottom:0}
.thr{width:100%;border-collapse:collapse;font-size:13px}
.thr th{font-family:"Barlow Condensed","Helvetica Neue Condensed","Arial Narrow",Arial,sans-serif;text-transform:uppercase;letter-spacing:.06em;
  font-size:10.5px;color:var(--muted);font-weight:600;text-align:center;padding:4px 3px}
.thr th.l{text-align:left}
.thr td{padding:2px 3px}
.thr td.l{font-family:"Barlow Condensed","Helvetica Neue Condensed","Arial Narrow",Arial,sans-serif;text-transform:uppercase;letter-spacing:.03em;
  font-weight:600;font-size:11px;color:var(--ink2);white-space:nowrap;padding-right:6px}
.thr input{width:100%;min-width:52px;padding:6px 2px;border:1px solid var(--line);border-radius:6px;
  background:var(--surface2);color:var(--ink);font-family:"Roboto Mono",monospace;font-size:13px;
  text-align:center;-webkit-appearance:none}
.scroller{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);
  border-top:1px solid var(--line);display:flex;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;padding:7px 2px;cursor:pointer;color:var(--muted);
  font-family:"Barlow Condensed","Helvetica Neue Condensed","Arial Narrow",Arial,sans-serif;text-transform:uppercase;letter-spacing:.07em;
  font-weight:600;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}

nav button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:8px}

.empty-msg{text-align:center;color:var(--muted);font-size:13.5px;padding:26px 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));
  background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;
  font-weight:600;z-index:50;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .18s}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<style id="css2">
.modebar{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:11px}
.mode{padding:10px 8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);
  color:var(--ink2);font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;text-transform:uppercase;
  letter-spacing:.09em;font-weight:700;font-size:14px;cursor:pointer}
.mode[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.matchbar{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);
  border-radius:11px;padding:11px 12px;box-shadow:var(--shadow);margin-bottom:12px}
.matchbar .mb1{flex:1;min-width:0}
.matchbar .opp{display:block;font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:17px;line-height:1.1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.matchbar .meta{display:block;font-size:11px;color:var(--muted);font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  text-transform:uppercase;letter-spacing:.07em;font-weight:600;margin-top:2px}
.score{font-family:"Roboto Mono",monospace;font-weight:700;font-size:20px;flex:0 0 auto;
  display:flex;align-items:center;gap:5px}
.score .w{color:var(--ok)} .score .l{color:var(--crit)} .score .d{color:var(--ink2)}
.score input{width:46px;padding:6px 2px;border:1px solid var(--line);border-radius:7px;
  background:var(--surface2);color:inherit;font:inherit;font-size:19px;text-align:center;-webkit-appearance:none}

.kpi{display:flex;flex-direction:column;gap:5px}
.kpirow{display:grid;grid-template-columns:1fr 58px 58px 56px;gap:6px;align-items:center;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.kpirow .kn{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;text-transform:uppercase;
  letter-spacing:.05em;font-weight:600;font-size:12.5px;color:var(--ink2);line-height:1.15}
.kpirow .kn em{font-style:normal;color:var(--club2);font-size:10px;display:block;letter-spacing:.08em}
.kpirow input{width:100%;padding:8px 2px;border:1px solid var(--line);border-radius:7px;
  background:var(--surface2);color:var(--ink);font-family:"Roboto Mono",monospace;font-size:15px;
  font-weight:600;text-align:center;-webkit-appearance:none}
.kpirow input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.diff{font-family:"Roboto Mono",monospace;font-weight:700;font-size:14px;text-align:center;
  padding:6px 2px;border-radius:7px;background:var(--surface2);color:var(--muted)}
.diff.good{background:var(--ok-bg);color:var(--ok)}
.diff.bad{background:var(--crit-bg);color:var(--crit)}
.kpihead{display:grid;grid-template-columns:1fr 58px 58px 56px;gap:6px;padding:0 10px 4px}
.kpihead span{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;text-transform:uppercase;
  letter-spacing:.08em;font-size:10px;font-weight:700;color:var(--muted);text-align:center}
.kpihead span:first-child{text-align:left}

.tapgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.tap{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px 6px 9px;
  display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;box-shadow:var(--shadow);
  font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;min-height:74px;justify-content:center}
.tap b{font-family:"Roboto Mono",monospace;font-size:24px;font-weight:700;line-height:1}
.tap span{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;text-transform:uppercase;
  letter-spacing:.05em;font-size:10.5px;font-weight:600;color:var(--muted);text-align:center;line-height:1.15}
.tap:active{transform:scale(.96);background:var(--accent-soft)}
.tap.pos b{color:var(--ok)} .tap.neg b{color:var(--crit)} .tap.hero b{color:var(--club2)}
.tap.zero b{color:var(--muted)}
.tap:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.metrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;
  background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:10px 11px;margin-top:7px}
.metbtns{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.metrow .ml{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;text-transform:uppercase;
  letter-spacing:.05em;font-weight:600;font-size:12px;color:var(--ink2)}
.metrow .mval{font-family:"Roboto Mono",monospace;font-weight:700;font-size:19px;min-width:44px;text-align:right}
.mbtn{padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);
  color:var(--ink);font-family:"Roboto Mono",monospace;font-weight:700;font-size:13px;cursor:pointer}
.mbtn:active{background:var(--accent-soft)}

.pchips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 9px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.pchips::-webkit-scrollbar{display:none}
.pchip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink2);
  border-radius:9px;padding:7px 11px;font-family:"Barlow",-apple-system,"Helvetica Neue",Arial,sans-serif;
  font-weight:600;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px}
.pchip i{font-style:normal;font-family:"Roboto Mono",monospace;font-size:11px;color:var(--muted)}
.pchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pchip[aria-pressed="true"] i{color:var(--accent-ink);opacity:.8}

.statline{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);
  border-radius:9px;padding:9px 11px}
.statline .sl{flex:1;font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;text-transform:uppercase;
  letter-spacing:.05em;font-weight:600;font-size:12px;color:var(--ink2)}
.statline .sv{font-family:"Roboto Mono",monospace;font-weight:700;font-size:16px}
.statline .sw{font-size:12px;color:var(--muted);flex:0 0 auto;max-width:46%;text-align:right;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.ptable{width:100%;border-collapse:collapse;font-size:13px}
.ptable th{position:sticky;top:0;background:var(--accent);color:var(--accent-ink);
  font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;text-transform:uppercase;
  letter-spacing:.05em;font-size:10px;font-weight:700;padding:7px 3px;text-align:center;z-index:2}
.ptable th.l{text-align:left;padding-left:8px;left:0;z-index:3}
.ptable td{padding:2px;text-align:center;border-bottom:1px solid var(--line)}
.ptable td.l{text-align:left;font-weight:600;font-size:13px;padding-left:8px;white-space:nowrap;
  position:sticky;left:0;background:var(--surface);z-index:1}
.ptable input{width:42px;padding:6px 1px;border:1px solid var(--line);border-radius:6px;
  background:var(--surface2);color:var(--ink);font-family:"Roboto Mono",monospace;font-size:13px;
  text-align:center;-webkit-appearance:none}
.ptable input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.ptable tbody tr:nth-child(even),.ptable tbody tr:nth-child(even) td.l{background:var(--surface2)}

.mlist{display:flex;flex-direction:column;gap:5px}
.mrow{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);
  border-radius:10px;padding:10px 11px;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.mrow[aria-current="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.mrow .mo{flex:1;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .md{display:block;font-size:11px;color:var(--muted);font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.mrow .ms{font-family:"Roboto Mono",monospace;font-weight:700;font-size:15px}
.mrow .ms.w{color:var(--ok)} .mrow .ms.l{color:var(--crit)} .mrow .ms.d{color:var(--ink2)}

.sqrow{display:grid;grid-template-columns:52px 1fr auto;gap:9px;align-items:center;background:var(--surface);
  border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.sqrow input[type=number]{width:100%;padding:8px 2px;border:1px solid var(--line);border-radius:7px;
  background:var(--surface2);color:var(--ink);font-family:"Roboto Mono",monospace;font-size:15px;
  text-align:center;-webkit-appearance:none}
.sqrow .snm{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sqrow .tog{width:52px;height:30px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);
  position:relative;cursor:pointer;padding:0}
.sqrow .tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
  background:var(--muted);transition:left .14s,background .14s}
.sqrow .tog[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.sqrow .tog[aria-pressed="true"]::after{left:25px;background:var(--accent)}
.sqrow.off{opacity:.5}
.undo{display:flex;gap:8px;margin-top:9px}
.sub2 .att{font-weight:700}
.sub2 .att.z0{color:var(--ok)} .sub2 .att.z1{color:var(--warn)}
.sub2 .att.z2{color:var(--high)} .sub2 .att.z3{color:var(--crit)}

  if(d.mom!=null) add("mom","Sprint momentum",String(Math.round(d.mom)));

  if(d.fly20!=null) x.push("Flying 20m|"+d.fly20.toFixed(2)+"s");
  var a=attStats(p.n,null), att=null;
  if(a.elig) att=[a.pct+"%", (a.p+a.l)+" of "+a.elig, attZone(a.pct)];
  var dt=new Date();
  var mo=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var out={c:S.club||"Al Ain Amblers", n:p.n, p:posLabel(p)||"", d:dt.getDate()+" "+mo[dt.getMonth()]+" "+dt.getFullYear(), m:m};

    out.e=[isFwd(eg)?"forwards":"backs", er];
  }
  if(x.length) out.x=x;
  if(att) out.a=att;
  return out;

function copyText(txt){

    navigator.clipboard.writeText(txt).then(function(){ toast("Copied"); },function(){ legacyCopy(txt); });

function legacyCopy(txt){
  try{

    ta.value=txt; ta.setAttribute("readonly","");
    ta.style.position="fixed"; ta.style.top="-1000px";
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,txt.length);

  var a=document.createElement("a"); a.href=u; a.download=fn; a.rel="noopener";
  document.body.appendChild(a); a.click();

}
function toast(msg){
  var t=document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.body.appendChild(t);

function posFit(p,g){
  var d=derive(p), keys=["bronco","s10","s30","s40","s60","mv","fatigue"], n=0, ok=0;
  keys.forEach(function(k){ var v2=d[k]; if(v2==null) return; n++; if(zoneOf(k,v2,g)===0) ok++; });
  return {n:n,ok:ok};
}

function setDepth(){
  function block(grp){
    var rows=POS.filter(function(x){ return x[1]===grp; }).map(function(x){
      var d=depthOf(x[0]), need=NEED[x[0]]||0;
      var z = need===0 ? "" : (d.act>=need ? "z0" : (d.act>0 ? "z1" : "z3"));
      var pctw=Math.min(100, d.tot? (d.tot/Math.max(3,need+2))*100 : 0);
      return '<div class="deprow"><span class="dn">'+esc(x[0])
        +'<em>'+(need?('needs '+need+' on a matchday'):'cover only')+'</em></span>'
        +'<span class="bar"><i class="'+(z||"")+'" style="width:'+pctw.toFixed(0)+'%"></i></span>'
        +'<span class="dc '+z+'">'+d.act+'<small>of '+d.tot+'</small></span></div>'; }).join("");
    return '<div class="hd"><h2>'+grp+'s</h2></div><div class="list">'+rows+'</div>';
  }
  var noPos2=S.players.filter(function(p){ return !posList(p).length; }).length;
  var fw=0,bk=0;
  S.players.forEach(function(p){ if(stOf(p)!=="active") return;

function eliteCard(g){

   +'<p>Bronco: 133 Super Rugby players (Sella et al. 2021). Sprints and body mass: 39 Super Rugby '

   +'six position groups at professional level, and there is no published professional figure for '

function setStandards(){

  var rows=THRKEYS.map(function(k){
    var m=FIT[k], b=bands(k,g);

      return '<td><input data-thr="'+k+'|'+g+'|'+bi+'" inputmode="decimal" value="'+x+'"></td>'; }).join("");

    return '<tr><td class="l">'+m.name+'<br><span style="font-weight:400;font-size:9.5px;opacity:.7">'
      +unit+'</span></td>'+cells+'</tr>'; }).join("");

   +'<div class="hd"><h2>'+grpName(g)+'</h2><span class="note">elite → worst</span></div>'
   +'<div class="card"><div class="scroller"><table class="thr">'

   +rows+'</table></div></div>'

   +'<div class="hd"><h2>Where these come from</h2></div><div class="card">'
   +'<p><strong>10m, 30m, max velocity, momentum</strong> — anchored to published means for '
   +'<strong>amateur</strong> senior union players by position (Zabaloy et al. 2021, 64 club players, '
   +'age 24). "Meets standard" sits at roughly the amateur average for that position group.</p>'
   +'<p><strong>40m and 60m</strong> — scaled from the same authors\' senior amateur forwards/backs '
   +'figures (40m 5.67 / 5.41 s, 50m 6.99 / 6.64 s). Nobody publishes a 60m rugby standard, so the 60m '
   +'is an extension of the 50m data, not a measured norm.</p>'
   +'<p><strong>Bronco</strong> — elite band is real professional data (Super Rugby: backs 294 s, '
   +'forwards 311 s). The club bands step down from it.</p>'
   +'<p><strong>Fatigue index</strong> — derived so a player sitting exactly on the Bronco and max-velocity '

    if(!nn){ toast("Type a name first"); return; }
    if(playerIndex(nn)<0){
      S.players.push({n:nn,p:"",rps:[],w:null,b:null,s10:null,s30:null,s40:null,s60:null});
      S.players.sort(byName);
      S.matches.forEach(function(mm){ if(!mm.sq[nn]) mm.sq[nn]={on:false,no:null}; });
    }
    commit(); toast("Added "+nn); return;
  }
});

document.addEventListener("input",function(ev){
  var el=ev.target;
  if(!el.id||el.id.indexOf("e_")!==0) return;
  if(el.maxLength>0&&el.value.length>el.maxLength) el.value=el.value.slice(0,el.maxLength);
  var ro=document.getElementById("e_readout"); if(!ro) return;
  function f(x){ return x==null?"—":x.toFixed(2); }
  ro.innerHTML='<span>Saving</span> '+f(splitTime(raw("e_10s"),raw("e_10h")))
   +' &nbsp;·&nbsp; '+f(splitTime(raw("e_30s"),raw("e_30h")))
   +' &nbsp;·&nbsp; '+f(splitTime(raw("e_40s"),raw("e_40h")))
   +' &nbsp;·&nbsp; '+f(splitTime(raw("e_60s"),raw("e_60h")));
});

document.addEventListener("change",function(ev){
  var el=ev.target,m=M();
  if(el.id==="restorefile"){
    var file=el.files&&el.files[0]; if(!file) return;
    var fr=new FileReader();
    fr.onload=function(){
      try{
        var o=JSON.parse(fr.result);
        if(o.players&&o.matches){ S=o; }
        else if(o.players){ S.players=o.players; if(o.thr) S.thr=o.thr; }
        else if(o.matches&&o.roster){ S.matches=o.matches; S.active=o.active;
          o.roster.forEach(function(nm){ if(playerIndex(nm)<0)
            S.players.push({n:nm,p:"",rps:[],w:null,b:null,s10:null,s30:null,s40:null,s60:null}); });
          S.players.sort(byName); }
        else throw 0;
        if(!S.thr) S.thr={}; if(!S.matches) S.matches=[]; if(!S.sessions) S.sessions=[];
        normalize(); UI.player=null; UI.posOpen=-1; commit(); toast("Restored");
      }catch(err){ toast("That file is not a backup"); }
    };
    fr.readAsText(file); return;
  }
  if(el.id&&el.id.indexOf("ph_")===0){
    var pix=+el.id.slice(3), file2=el.files&&el.files[0];
    if(!file2) return;
    if(file2.size>12*1024*1024){ toast("That image is too big"); return; }
    readPhoto(file2,function(dataUrl){
      if(!dataUrl){ toast("Could not read that image"); return; }
      S.players[pix].img=dataUrl;
      try{ commit(); toast("Photo saved"); }
      catch(e2){ S.players[pix].img=null; toast("No room left for photos"); render(); }
    });
    return;
  }
  if(el.id==="psel"){ UI.sel=+el.value; render(); window.scrollTo(0,0); return; }

  if(el.hasAttribute("data-wt")){ S.players[+el.getAttribute("data-wt")].w=num(el.value); commit(); return; }
  if(el.hasAttribute("data-thr")){
    var pr=el.getAttribute("data-thr").split("|"),k=pr[0],g=pr[1],bi=+pr[2];
    if(!S.thr[k]) S.thr[k]={};
    if(!S.thr[k][g]) S.thr[k][g]=bands(k,g==="B"?"Back":(g==="F"?"Forward":"")).slice();
    var nv=num(el.value); if(nv!=null) S.thr[k][g][bi]=nv;
    commit(); return;
  }
  if(el.hasAttribute("data-sd")){ var s6=SS(); if(s6){ s6[el.getAttribute("data-sd")]=el.value; commit(); } return; }
  if(!m) return;
  if(el.hasAttribute("data-t")){ var q=el.getAttribute("data-t").split("|");
    m.t[q[0]][q[1]]=num(el.value); commit(); return; }
  if(el.hasAttribute("data-ps")){ var q2=el.getAttribute("data-ps").split("|");
    var o2=ps(m,q2[0]),nv2=num(el.value);
    if(nv2==null) delete o2[q2[1]]; else o2[q2[1]]=nv2; commit(); return; }
  if(el.hasAttribute("data-no")){ var n3=el.getAttribute("data-no");
    if(!m.sq[n3]) m.sq[n3]={on:false,no:null};
    m.sq[n3].no=num(el.value); commit(); return; }
  if(el.hasAttribute("data-md")){ m[el.getAttribute("data-md")]=el.value; commit(); return; }
});

function exportFitness(){
  var head2=["Name","Positions","Group","Status","Weight kg","Bronco sec","Bronco","MAS m/s","10m","30m","60m",
    "40m","Flying 30m","Flying 20m","Max vel","Momentum","Fatigue index %"];
  var lines=[head2.join(",")];
  S.players.forEach(function(p){
    var d=derive(p);
    function n(x,dp){ return x==null?"":Number(x).toFixed(dp); }
    lines.push([JSON.stringify(p.n),JSON.stringify(posList(p).join("; ")),p.p||"",stOf(p),p.w==null?"":p.w,
      n(d.bronco,0),mmss(d.bronco),n(d.mas,2),n(d.s10,2),n(d.s30,2),n(d.s60,2),n(d.fly,2),
      n(d.s40,2),n(d.fly20,2),n(d.mv,2),n(d.mom,0),n(d.fatigue,1)].join(","));
  });
  download("amblers-fitness.csv",lines.join("\n"),"text/csv;charset=utf-8");
  toast("Fitness CSV exported");
}
function exportAttendance(){
  var ses=S.sessions.slice().sort(function(a,b){ return (a.date||"")<(b.date||"")?-1:1; });
  var lines=[["Player","Present","Late","Injured","Absent","Attendance %"]
    .concat(ses.map(function(s2){ return (s2.date||"")+" "+(s2.type||""); })).join(",")];
  S.players.forEach(function(p){
    var a=attStats(p.n,null);
    lines.push([JSON.stringify(p.n),a.p,a.l,a.i,a.a,a.pct==null?"":a.pct]
      .concat(ses.map(function(s2){ return attOf(s2,p.n); })).join(","));
  });
  download("amblers-attendance.csv",lines.join("\n"),"text/csv;charset=utf-8");
  toast("Attendance CSV exported");
}
function exportMatch(){
  var m=M(); if(!m){ toast("No match"); return; }
  var lines=["Al Ain Amblers,v "+(m.opp||"")+","+dateLabel(m.date)+","+(m.venue==="H"?"Home":"Away"),""];
  lines.push(["Player"].concat(STATS.map(function(s){return s.n;})).concat(["Tackle %"]).join(","));
  squad(m).forEach(function(p){
    var tk=pct(v(m,p.n,"tkm"),v(m,p.n,"tkx"));
    lines.push([JSON.stringify(p.n)].concat(STATS.map(function(s){ return v(m,p.n,s.k); }))
      .concat([tk==null?"":tk]).join(","));
  });
  lines.push(["TOTAL"].concat(STATS.map(function(s){ return s.k==="min"?"":total(m,s.k); }))
    .concat([pct(total(m,"tkm"),total(m,"tkx"))||""]).join(","));
  lines.push("","Team indicator,Us,Them,Diff");
  TEAM.forEach(function(t){
    var a=num(m.t.us[t.k]),b=num(m.t.them[t.k]);
    lines.push([JSON.stringify(t.n),a==null?"":a,b==null?"":b,
      (a!=null&&b!=null)?(Math.round((a-b)*10)/10):""].join(","));
  });
  download("amblers-"+(m.opp||"match").replace(/[^A-Za-z0-9]+/g,"-").toLowerCase()+".csv",
    lines.join("\n"),"text/csv;charset=utf-8");
  toast("Match CSV exported");
}

function setTxt(id,txt){ var e=document.getElementById(id); if(e&&e.textContent!==txt) e.textContent=txt; }
setInterval(function(){
  if(!document.getElementById("k_pos_us")) return;
  var m2=M(); if(!m2) return;
  var c2=clk(m2);
  var a=elapsed(c2.pos,"us"), b2=elapsed(c2.pos,"them");
  var d2=elapsed(c2.ter,"opp"), e2=elapsed(c2.ter,"own");
  setTxt("k_pos_us",clkfmt(a)); setTxt("k_pos_them",clkfmt(b2));
  setTxt("k_ter_opp",clkfmt(d2)); setTxt("k_ter_own",clkfmt(e2));
  var p2=clkPct(a,b2), q2=clkPct(d2,e2);
  setTxt("k_pos_pct",p2==null?"—":p2+"%");
  setTxt("k_ter_pct",q2==null?"—":q2+"%");
  setTxt("k_pos_tot","Ball in play "+clkfmt(a+b2));
  setTxt("k_ter_tot","Tracked "+clkfmt(d2+e2));
},1000);

render();
if(MIGRATED){ setTimeout(function(){ toast("Brought across your "+MIGRATED); commit(); },400); }
})();
